services:
  nodecast-tv:
    # Recommended for Oracle Always Free, your own server, or custom forks:
    build: .
    # Alternative (if you want the pre-built image from the main repo):
    # image: ghcr.io/technomancer702/nodecast-tv:latest
    #
    # For GitHub-based build (no need to git clone on server):
    # build: https://github.com/zsivasto-ui/nodecast-tv.git#main
    container_name: nodecast-tv
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./transcode-cache:/app/transcode-cache
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    # For Oracle free / low-resource tiers: software encoding + lower res is strongly recommended
    # (the app now defaults to this in code, but you can tune in Settings → Transcoding after first login)
